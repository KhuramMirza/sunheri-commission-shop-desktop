appId: com.soneri.mandibilling
productName: Soneri Commission Shop
copyright: Copyright © 2026 Soneri Commission Shop

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - package.json
  - build/icon.png
  - build/icon.ico

asar: true

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Soneri Commission Shop
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerLanguages:
    - en_US
  artifactName: ${productName}-Setup-${version}.${ext}

portable:
  artifactName: ${productName}-Portable-${version}.${ext}
